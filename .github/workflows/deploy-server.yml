name: Deploy to own server (rsync, manual fallback)

# ⚠️ 这是【旧的推送式部署】：CI 通过 SSH 登录服务器再 rsync。
#    它的副作用是服务器会记录来自国外机房（GitHub 运行器在 Azure）的 root 登录，
#    阿里云会因此发"异地登录"告警。
#
#    现在推荐用【服务器侧拉取】：.github/workflows/publish-site.yml 只发布构建产物，
#    服务器用 systemd timer 主动来下载 —— 不需要任何入站 SSH。见 docs/deploy-own-server.md 第 5.5 节。
#
#    本文件因此改成【只能手动触发】，保留作为应急兜底（例如服务器拉取链路临时不通时）。
#    确认拉取部署稳定后，可以删掉本文件并删除下面这 5 个 Secrets：
#      SSH_HOST / SSH_PORT / SSH_USER / SSH_KEY / SSH_TARGET
#
# 需要的 Secrets（配置步骤见 docs/deploy-own-server.md 第 5 节）：
#   SSH_HOST（服务器 IP）、SSH_PORT（一般 22）、SSH_USER（登录用户）、
#   SSH_KEY（部署私钥的完整内容，OpenSSH 格式、不要带 passphrase）、
#   SSH_TARGET（站点根目录，如 /var/www/myqian-bao.top）
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "构建时注入的站点地址（canonical / sitemap / RSS 用）"
        required: false
        default: "https://myqian-bao.top"
      prune:
        description: "删除服务器上多余的文件（--delete），核对目录无误后再开"
        type: boolean
        default: false

concurrency:
  group: deploy-own-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Secrets 是否就绪
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          missing=""
          [ -z "$SSH_HOST" ]   && missing="$missing SSH_HOST"
          [ -z "$SSH_USER" ]   && missing="$missing SSH_USER"
          [ -z "$SSH_KEY" ]    && missing="$missing SSH_KEY"
          [ -z "$SSH_TARGET" ] && missing="$missing SSH_TARGET"
          if [ -n "$missing" ]; then
            echo "::error::还缺少这些 Secrets：$missing —— 配置步骤见 docs/deploy-own-server.md 第 5 节"
            exit 1
          fi
          echo "Secrets 齐了，目标：$SSH_USER@$SSH_HOST:$SSH_TARGET"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        env:
          # 站点在根路径，PUBLIC_BASE_PATH 必须是 /，否则样式和链接会 404
          PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://myqian-bao.top' }}
          PUBLIC_BASE_PATH: /
        run: pnpm build

      - name: 写入部署私钥
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH_KEY 首行：$(head -n1 ~/.ssh/deploy_key)"
          echo "SSH_KEY 行数：$(wc -l < ~/.ssh/deploy_key)"
          # 私钥能解析出公钥，说明格式没问题（不会打印私钥内容）
          if key=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>/dev/null); then
            echo "私钥格式 OK，指纹：$(echo "$key" | ssh-keygen -lf - | awk '{print $2}')"
          else
            echo "::error::SSH_KEY 不是有效的未加密 OpenSSH 私钥。常见原因："
            echo "::error::1) 粘成了公钥（首行应是 -----BEGIN OPENSSH PRIVATE KEY-----，而不是 ssh-ed25519/ssh-rsa AAAA…）"
            echo "::error::2) 私钥带 passphrase（生成时要加 -N \"\"）"
            echo "::error::3) 复制不完整，缺少 BEGIN/END 行或中间有截断"
            echo "::error::4) 是 PuTTY .ppk / PKCS#8 格式（需转成 OpenSSH 格式）"
            echo "::error::修复办法见 docs/deploy-own-server.md 第 5.1 节"
            exit 1
          fi

      - name: 预检（SSH 连通性 / rsync / 目标目录）
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" "TARGET='$SSH_TARGET' bash -s" <<'REMOTE'
          set -u
          echo "SSH 连接成功：$(hostname)"
          if ! command -v rsync >/dev/null; then
            echo "❌ 服务器没装 rsync —— 请在服务器上执行：sudo apt install -y rsync"; exit 3
          fi
          echo "rsync：$(rsync --version | head -n1)"
          if [ ! -d "$TARGET" ]; then
            echo "❌ 目标目录不存在：$TARGET —— 先 mkdir -p 并 chown 给 nginx 用户"; exit 4
          fi
          if [ ! -w "$TARGET" ]; then
            echo "❌ 目标目录不可写：$TARGET（检查属主/权限，或换用有权限的用户）"; exit 5
          fi
          echo "✅ 预检通过：$TARGET 存在且可写"
          REMOTE

      - name: 同步 dist/ 到服务器
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          set -o pipefail
          rsync -avz --human-readable ${{ inputs.prune && '--delete' || '' }} --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET/" | tail -n 20
          echo "✅ 已同步到 $SSH_HOST:$SSH_TARGET"

      - name: 完成提示
        run: |
          echo "站点地址：${{ inputs.site_url || 'https://myqian-bao.top' }}"
          echo "注意：域名 80/443 需完成 ICP 备案后才会被阿里云放行；"
          echo "备案通过前可以先用 http://<服务器IP>/ 验证。"
