name: Live data collector

# 定时抓取 B站 / 抖音 的直播状态与粉丝数，写入 src/data/live/*.json
# 数据有变化时：先提交，再显式派发部署工作流（Pages + 自建服务器），页面即可看到最新数据。
#
# ⚠️ 为什么要"显式派发"：本工作流用默认的 GITHUB_TOKEN 推送，而 GitHub 会抑制由
#    GITHUB_TOKEN 产生的 push 事件（防递归），所以数据提交【不会】自动触发 deploy.yml。
#    解决办法就是在提交成功后用 `gh workflow run` 手动派发一次（workflow_dispatch 是
#    GitHub 明确保留的例外，见 https://github.blog/changelog/2022-09-08-github-actions-use-github_token-with-workflow_dispatch-and-repository_dispatch/），
#    因此需要给本工作流 actions: write 权限。
#
# 仓库：Fire0King/Fire0King.github.io（用户站，默认分支 main，站点在根路径）
#
# 说明：
#   · cron 使用 UTC 时间，*/10 * * * * 表示每 10 分钟一次（GitHub 高峰期可能延迟几分钟）
#   · 定时任务只在仓库的【默认分支】上运行，所以本文件必须存在于默认分支
#   · 公开仓库的 Actions 分钟数免费不限量；私有仓库每月只有 2000 分钟，
#     建议把频率改成 */30（并同步修改 src/config/live-report.config.json 的 intervalMinutes）
#   · 本工作流只在有内容变化时才提交，避免制造无意义的提交记录
#   · 需要仓库 Settings → Actions → General 允许 Write 权限（工作流里已声明 contents: write）
#     且默认分支不能有阻止 Actions 推送的规则，否则提交会失败

on:
  schedule:
    - cron: "*/10 * * * *"
  # 手动触发：仓库 Actions 页面上的 Run workflow
  workflow_dispatch:
  # 修改抓取脚本或配置后立即验证一次
  push:
    branches: [ master, main ]
    paths:
      - "scripts/live-data/**"
      - "src/config/live-report.config.json"
      - ".github/workflows/live-data.yml"

# contents: write 用于把采集结果提交回仓库；actions: write 用于派发部署工作流
permissions:
  contents: write
  actions: write

# 同一时间只跑一个采集任务，避免两个任务同时改写数据文件
concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/live-data/package-lock.json

      - name: Install collector dependencies
        run: npm ci --prefix scripts/live-data --no-audit --no-fund

      - name: Collect live data
        env:
          # 可选：在仓库 Settings → Secrets and variables → Actions 里配置
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
        run: node scripts/live-data/collect.mjs

      - name: Commit data changes
        id: commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain src/data/live)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAMP=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          git add src/data/live
          git commit -m "chore(data): 更新直播数据 ${STAMP}"
          # 采集期间可能有人推了新提交，push 失败就 rebase 后重试
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 失败，第 ${attempt} 次重试前先 rebase"
            git pull --rebase --autostash
            sleep 5
          done
          echo "连续三次 push 失败，请检查分支保护规则是否允许 Actions 推送" >&2
          exit 1

      # 数据提交用的是 GITHUB_TOKEN，GitHub 会抑制它产生的 push 事件，
      # 所以这里显式派发两个工作流（workflow_dispatch 是官方保留的例外）：
      #   deploy.yml        → 更新 GitHub Pages
      #   publish-site.yml  → 重新发布构建产物 Release，服务器侧拉取会自己来取
      - name: Trigger deployments
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          gh workflow run deploy.yml --ref "$REF"
          gh workflow run publish-site.yml --ref "$REF"
          echo "已派发：GitHub Pages（deploy.yml）+ 站点产物（publish-site.yml），ref=$REF"
