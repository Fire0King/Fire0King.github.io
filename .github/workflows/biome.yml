name: Code quality

on:
  push:
    branches: [ master, main ] # Adjust branches as needed
    # 直播数据由 live-data 工作流自动提交，无需为此跑代码风格检查
    paths-ignore:
      - "src/data/live/**"
  pull_request:
    branches: [ master, main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 钉死版本，与 package.json 的 @biomejs/biome 保持一致。
          # 原来写 latest，Biome 一升级就开始格式化 Markdown（src/content/**），
          # 导致历史文章文件被判定「格式不一致」把 CI 打红，跟代码无关。
          version: 2.5.12
      - name: Run Biome
        run: biome ci ./src --reporter=github
